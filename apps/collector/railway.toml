# Railway deployment for collector service
# Uses Dockerfile for proper monorepo workspace support

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/collector/Dockerfile.railway"

[deploy]
startCommand = "node dist/index.js"
# Readiness (not liveness): dependency failure must not count as healthy.
# Workers start before listen; timeout still covers slow Redis/DB cold start.
healthcheckPath = "/readyz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
