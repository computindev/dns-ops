name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dns_ops_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dns_ops_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dns_ops_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Build DB package
        run: bun run --filter @dns-ops/db build

      - name: Check DB drift
        run: bun run --filter @dns-ops/db check-drift

      - name: Verify DB migrations
        run: bun run --filter @dns-ops/db verify-migrations

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Push DB schema
        run: bunx drizzle-kit push --force
        working-directory: packages/db

      - name: Test
        env:
          RUN_LIVE_DNS_TESTS: "0"
        run: pnpm test

      - name: Build
        run: bun run build

      - name: Start Collector
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/dns_ops_ci
          PORT: "3001"
          NODE_ENV: development
          WORKER_ENABLED: "false"
        run: |
          node apps/collector/dist/index.js &
          echo "Waiting for collector to become ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/healthz > /dev/null 2>&1; then
              echo "Collector is ready (attempt $i)"
              exit 0
            fi
            echo "  attempt $i/30 — sleeping 2s"
            sleep 2
          done
          echo "ERROR: collector did not start within 60s"
          exit 1

      - name: E2E Tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/dns_ops_ci
          COLLECTOR_URL: http://localhost:3001
          NODE_ENV: development
          E2E_DEV_TENANT: dns-ops-e2e
          E2E_DEV_ACTOR: e2e-bot
        run: bun run e2e
        working-directory: apps/web

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
